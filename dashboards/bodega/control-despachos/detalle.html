<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102348">
  <title>Detalle de factura · Control de despachos</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      color: #17233b;
      background: #f1f5f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }

    .page-header {
      padding: 24px max(20px, calc((100% - 1040px) / 2));
      color: #fff;
      background: #102348;
    }

    .page-header h1 {
      margin: 0;
      font-size: clamp(1.35rem, 4vw, 1.8rem);
      line-height: 1.25;
    }

    .page-header p {
      margin: 8px 0 0;
      color: #dbe5f5;
      font-size: 0.95rem;
    }

    main {
      width: min(100% - 32px, 1040px);
      margin: 28px auto 48px;
    }

    .message {
      margin: 0 0 20px;
      padding: 14px 16px;
      border: 1px solid #f1b9b9;
      border-radius: 8px;
      color: #8f2020;
      background: #fff1f1;
      line-height: 1.5;
    }

    .message[hidden] {
      display: none;
    }

    .card {
      margin: 0 0 20px;
      padding: clamp(18px, 4vw, 26px);
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 2px 8px rgb(16 35 72 / 4%);
    }

    .card h2 {
      margin: 0 0 20px;
      color: #102348;
      font-size: 1.2rem;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 24px;
    }

    .field {
      min-width: 0;
      margin: 0;
    }

    .field dt {
      margin-bottom: 6px;
      color: #59677d;
      font-size: 0.83rem;
      font-weight: 700;
    }

    .field dd {
      margin: 0;
      overflow-wrap: anywhere;
      color: #17233b;
      font-size: 1rem;
      line-height: 1.45;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .status-green {
      color: #17643a;
      background: #e4f5eb;
    }

    .status-yellow {
      color: #785200;
      background: #fff3cd;
    }

    .status-red {
      color: #9b2525;
      background: #fde8e8;
    }

    .status-neutral {
      color: #45546b;
      background: #edf1f6;
    }

    .additional-list {
      display: grid;
      gap: 18px;
      margin: 0;
    }

    .additional-list .field dd {
      white-space: pre-wrap;
    }

    .detail-note {
      margin: -6px 0 18px;
      color: #59677d;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .table-scroll {
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }

    .additional-table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .additional-table th,
    .additional-table td {
      padding: 9px 12px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
      vertical-align: top;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .additional-table th {
      white-space: nowrap;
      color: #102348;
      background: #f1f5f9;
      font-weight: 700;
    }

    .additional-table td {
      min-width: 84px;
      max-width: 280px;
    }

    .additional-table tr:last-child td {
      border-bottom: 0;
    }

    @media (max-width: 600px) {
      .page-header {
        padding: 20px 16px;
      }

      main {
        width: min(100% - 24px, 1040px);
        margin-top: 18px;
      }

      .field-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .additional-table {
        font-size: 0.84rem;
      }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>Detalle de factura</h1>
    <p>Control de despachos de bodega</p>
  </header>
  <main>
    <p id="message" class="message" role="alert" hidden></p>
    <div id="content" hidden></div>
  </main>

  <script>
    (function () {
      "use strict";

      var errorMessageElement = document.getElementById("message");
      var invoiceDetailsElement = document.getElementById("content");
      var standardInvoiceFields = new Set([
        "pais",
        "numeroFactura",
        "fechaEmision",
        "fechaDespacho",
        "estatus",
        "codigoCliente",
        "nombreCliente",
        "totalFactura",
        "docEntry",
        "detalleArticulos",
        "registrosApi"
      ]);

      function showMessage(errorMessage) {
        errorMessageElement.textContent = errorMessage;
        errorMessageElement.hidden = false;
        invoiceDetailsElement.hidden = true;
      }

      function getDateParts(dateValue, timeZone) {
        if (typeof dateValue !== "string" && typeof dateValue !== "number") {
          return null;
        }

        var dateText = String(dateValue).trim();
        var dateOnlyMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateText);
        if (dateOnlyMatch) {
          var dateYear = Number(dateOnlyMatch[1]);
          var dateMonth = Number(dateOnlyMatch[2]);
          var dateDay = Number(dateOnlyMatch[3]);
          var validatedDate = new Date(Date.UTC(dateYear, dateMonth - 1, dateDay));
          if (validatedDate.getUTCFullYear() !== dateYear ||
              validatedDate.getUTCMonth() !== dateMonth - 1 ||
              validatedDate.getUTCDate() !== dateDay) {
            return null;
          }
          return { year: dateYear, month: dateMonth, day: dateDay };
        }

        var parsedDate = new Date(dateValue);
        if (Number.isNaN(parsedDate.getTime())) {
          return null;
        }
        var formattedParts = new Intl.DateTimeFormat("en-US", {
          timeZone: timeZone,
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(parsedDate);
        var dateParts = {};
        for (var partIndex = 0; partIndex < formattedParts.length; partIndex += 1) {
          if (formattedParts[partIndex].type === "year") {
            dateParts.year = Number(formattedParts[partIndex].value);
          }
          if (formattedParts[partIndex].type === "month") {
            dateParts.month = Number(formattedParts[partIndex].value);
          }
          if (formattedParts[partIndex].type === "day") {
            dateParts.day = Number(formattedParts[partIndex].value);
          }
        }
        return dateParts.year && dateParts.month && dateParts.day ? dateParts : null;
      }

      function formatDate(dateValue, timeZone) {
        var dateParts = getDateParts(dateValue, timeZone);
        if (!dateParts) return "—";
        return String(dateParts.day).padStart(2, "0") + "/" +
          String(dateParts.month).padStart(2, "0") + "/" + dateParts.year;
      }

      function getUtcDayNumber(dateParts) {
        return Date.UTC(dateParts.year, dateParts.month - 1, dateParts.day) / 86400000;
      }

      function calculateActiveDays(invoiceRecord, timeZone, cutoffDateValue) {
        var emissionDateParts = getDateParts(invoiceRecord.fechaEmision, timeZone);
        var cutoffDateParts = cutoffDateValue
          ? getDateParts(cutoffDateValue, timeZone)
          : getDateParts(Date.now(), timeZone);
        if (!emissionDateParts || !cutoffDateParts) return "—";
        return String(Math.max(0, getUtcDayNumber(cutoffDateParts) -
          getUtcDayNumber(emissionDateParts)));
      }

      function determineProcessType(invoiceRecord, timeZone) {
        var customerCode = String(invoiceRecord.codigoCliente || "");
        if (customerCode.indexOf("CE") === 0) return "STR";

        var emissionDateParts = getDateParts(invoiceRecord.fechaEmision, timeZone);
        var dispatchDateParts = getDateParts(invoiceRecord.fechaDespacho, timeZone);
        if (emissionDateParts && dispatchDateParts &&
            emissionDateParts.year === dispatchDateParts.year &&
            emissionDateParts.month === dispatchDateParts.month) {
          var lastDayOfMonth = new Date(Date.UTC(
            emissionDateParts.year,
            emissionDateParts.month,
            0
          )).getUTCDate();
          if (dispatchDateParts.day === lastDayOfMonth) return "Cíclica";
        }
        return "Reserva";
      }

      function appendLabeledField(parentElement, fieldLabel, fieldValue, valueClass) {
        var wrapper = document.createElement("div");
        wrapper.className = "field";
        if (valueClass) wrapper.classList.add(valueClass);
        var term = document.createElement("dt");
        term.textContent = fieldLabel;
        var description = document.createElement("dd");
        description.textContent = fieldValue === null ||
          fieldValue === undefined ||
          fieldValue === ""
          ? "—"
          : String(fieldValue);
        wrapper.appendChild(term);
        wrapper.appendChild(description);
        parentElement.appendChild(wrapper);
        return description;
      }

      function formatInvoiceTotal(totalValue, countryCode) {
        if (totalValue === null || totalValue === undefined || totalValue === "") return "—";
        var numericTotal = Number(totalValue);
        if (!Number.isFinite(numericTotal)) return String(totalValue);
        return new Intl.NumberFormat(countryCode === "GT" ? "es-GT" : "es-SV", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(numericTotal);
      }

      function formatAdditionalValue(additionalValue) {
        if (additionalValue === null || additionalValue === undefined || additionalValue === "") {
          return "—";
        }
        if (typeof additionalValue === "object") {
          return JSON.stringify(additionalValue, null, 2);
        }
        return String(additionalValue);
      }

      function formatApiFieldLabel(fieldName) {
        var normalizedName = fieldName.replace(/[_\s-]/g, "").toLowerCase();
        var spanishLabels = {
          pais: "País",
          numerofactura: "No. factura",
          docentry: "DocEntry (SAP)",
          fechaemision: "Fecha de emisión",
          fechadespacho: "Fecha de vencimiento",
          estatus: "Estatus",
          codigocliente: "Código de cliente",
          nombrecliente: "Cliente",
          totalfactura: "Total factura",
          linea: "Línea",
          codigoarticulo: "Código de artículo",
          descripcion: "Descripción",
          cantidad: "Cantidad",
          descuento: "Descuento",
          totallinea: "Total de línea",
          tipofactura: "Tipo de factura",
          itemcode: "Código de artículo",
          itemname: "Artículo",
          itemdescription: "Descripción",
          dscription: "Descripción",
          description: "Descripción",
          quantity: "Cantidad",
          qty: "Cantidad",
          model: "Modelo",
          serialnumber: "Número de serie",
          serialnumbers: "Números de serie",
          internalserialnumber: "Número de serie interno",
          manufacturer: "Fabricante",
          brand: "Marca",
          warehousecode: "Código de bodega",
          warehousename: "Bodega",
          linetotal: "Total de línea",
          unitprice: "Precio unitario",
          price: "Precio",
          currency: "Moneda",
          linenum: "Número de línea",
          batchnumber: "Número de lote",
          project: "Proyecto",
          stock: "Existencia"
        };
        return spanishLabels[normalizedName] || fieldName;
      }

      function renderObjectArrayTable(parentElement, fieldName, objectRows) {
        var field = document.createElement("div");
        field.className = "field";
        var label = document.createElement("dt");
        label.textContent = formatApiFieldLabel(fieldName);
        field.appendChild(label);

        var description = document.createElement("dd");
        if (objectRows.length === 0) {
          description.textContent = "—";
          field.appendChild(description);
          parentElement.appendChild(field);
          return;
        }

        var columnNames = [];
        for (var rowIndex = 0; rowIndex < objectRows.length; rowIndex += 1) {
          if (objectRows[rowIndex] &&
              typeof objectRows[rowIndex] === "object" &&
              !Array.isArray(objectRows[rowIndex])) {
            Object.keys(objectRows[rowIndex]).forEach(function (columnName) {
              if (columnNames.indexOf(columnName) === -1) columnNames.push(columnName);
            });
          }
        }

        if (columnNames.length === 0) {
          description.textContent = objectRows.map(formatAdditionalValue).join(", ");
          field.appendChild(description);
          parentElement.appendChild(field);
          return;
        }

        var scroll = document.createElement("div");
        scroll.className = "table-scroll";
        var table = document.createElement("table");
        table.className = "additional-table";
        var head = document.createElement("thead");
        var headingRow = document.createElement("tr");
        columnNames.forEach(function (columnName) {
          var heading = document.createElement("th");
          heading.scope = "col";
          heading.textContent = formatApiFieldLabel(columnName);
          headingRow.appendChild(heading);
        });
        head.appendChild(headingRow);
        table.appendChild(head);

        var body = document.createElement("tbody");
        objectRows.forEach(function (objectRow) {
          var tableRow = document.createElement("tr");
          columnNames.forEach(function (columnName) {
            var cell = document.createElement("td");
            cell.textContent = objectRow &&
              typeof objectRow === "object" &&
              !Array.isArray(objectRow)
              ? formatAdditionalValue(objectRow[columnName])
              : "—";
            tableRow.appendChild(cell);
          });
          body.appendChild(tableRow);
        });
        table.appendChild(body);
        scroll.appendChild(table);
        description.appendChild(scroll);
        field.appendChild(description);
        parentElement.appendChild(field);
      }

      function appendAdditionalInvoiceInfo(parentElement, invoiceRecord) {
        var additionalFieldNames = Object.keys(invoiceRecord).filter(function (fieldName) {
          return !standardInvoiceFields.has(fieldName);
        });
        if (additionalFieldNames.length === 0) return;

        var card = document.createElement("section");
        card.className = "card";
        var heading = document.createElement("h2");
        heading.textContent = "Información adicional";
        card.appendChild(heading);
        var list = document.createElement("dl");
        list.className = "additional-list";

        additionalFieldNames.forEach(function (fieldName) {
          var additionalValue = invoiceRecord[fieldName];
          if (Array.isArray(additionalValue) && additionalValue.some(function (arrayItem) {
            return arrayItem !== null &&
              typeof arrayItem === "object" &&
              !Array.isArray(arrayItem);
          })) {
            renderObjectArrayTable(list, fieldName, additionalValue);
            return;
          }
          appendLabeledField(list, fieldName, formatAdditionalValue(additionalValue));
        });

        card.appendChild(list);
        parentElement.appendChild(card);
      }

      function collectNestedObjectArrays(value, fieldPath, collectedArrays) {
        if (!value || typeof value !== "object") return;

        if (Array.isArray(value)) {
          if (value.some(function (item) {
            return item !== null && typeof item === "object" && !Array.isArray(item);
          })) {
            collectedArrays.push({ fieldName: fieldPath, rows: value });
          }
          value.forEach(function (item, index) {
            collectNestedObjectArrays(item, fieldPath + "[" + index + "]", collectedArrays);
          });
          return;
        }

        Object.keys(value).forEach(function (key) {
          collectNestedObjectArrays(
            value[key],
            fieldPath ? fieldPath + "." + key : key,
            collectedArrays
          );
        });
      }

      function flattenArticleRows(articleDetails) {
        var flattenedRows = [];
        articleDetails.forEach(function (articleDetail) {
          if (!articleDetail || typeof articleDetail !== "object" ||
              Array.isArray(articleDetail)) {
            flattenedRows.push(articleDetail);
            return;
          }

          var nestedArticles = Object.keys(articleDetail).find(function (fieldName) {
            return fieldName.replace(/[_\s-]/g, "").toLowerCase() === "articulos" &&
              Array.isArray(articleDetail[fieldName]);
          });
          if (nestedArticles) {
            flattenedRows.push.apply(flattenedRows, articleDetail[nestedArticles]);
          } else {
            flattenedRows.push(articleDetail);
          }
        });
        return flattenedRows;
      }

      function getArticleRows(invoiceRecord) {
        return Array.isArray(invoiceRecord.detalleArticulos)
          ? flattenArticleRows(invoiceRecord.detalleArticulos)
          : [];
      }

      function getCalculatedInvoiceTotal(invoiceRecord) {
        var receivedTotal = Number(invoiceRecord.totalFactura);
        if (Number.isFinite(receivedTotal) && receivedTotal !== 0) {
          return receivedTotal;
        }

        var articleRows = getArticleRows(invoiceRecord);
        var calculatedTotal = articleRows.reduce(function (total, articleRow) {
          if (!articleRow || typeof articleRow !== "object" || Array.isArray(articleRow)) {
            return total;
          }

          var lineTotalField = Object.keys(articleRow).find(function (fieldName) {
            return fieldName.replace(/[_\s-]/g, "").toLowerCase() === "totallinea";
          });
          var lineTotal = lineTotalField ? Number(articleRow[lineTotalField]) : NaN;
          return total + (Number.isFinite(lineTotal) ? lineTotal : 0);
        }, 0);

        return calculatedTotal;
      }

      function removeArticleCollections(apiRecord) {
        if (!apiRecord || typeof apiRecord !== "object" || Array.isArray(apiRecord)) {
          return apiRecord;
        }
        return Object.keys(apiRecord).reduce(function (recordWithoutArticles, fieldName) {
          var normalizedName = fieldName.replace(/[_\s-]/g, "").toLowerCase();
          if (normalizedName !== "articulos") {
            recordWithoutArticles[fieldName] = apiRecord[fieldName];
          }
          return recordWithoutArticles;
        }, {});
      }

      function appendArticleDetails(parentElement, invoiceRecord) {
        var articleRows = getArticleRows(invoiceRecord);
        var fullApiRecords = Array.isArray(invoiceRecord.registrosApi)
          ? invoiceRecord.registrosApi.map(removeArticleCollections)
          : [];
        var card = document.createElement("section");
        card.className = "card";
        var heading = document.createElement("h2");
        heading.textContent = "Detalle de artículos y equipos";
        card.appendChild(heading);

        var explanation = document.createElement("p");
        explanation.className = "detail-note";
        explanation.textContent = articleRows.length
          ? "Se muestran los campos recibidos del API para los artículos y se conserva cada registro original de SAP para validar la información."
          : "La respuesta actual del API para esta factura no contiene campos de líneas de artículos o equipos. Se muestran abajo todos los campos que sí entregó.";
        card.appendChild(explanation);

        if (articleRows.length > 0 || fullApiRecords.length > 0) {
          var articleList = document.createElement("dl");
          articleList.className = "additional-list";
          if (articleRows.length > 0) {
            renderObjectArrayTable(
              articleList,
              "Campos disponibles por artículo o registro de SAP",
              articleRows
            );
          }
          if (fullApiRecords.length > 0) {
            renderObjectArrayTable(
              articleList,
              "Datos originales de SAP (sin repetir artículos)",
              fullApiRecords
            );
          }

          var nestedTables = [];
          articleRows.forEach(function (row, rowIndex) {
            collectNestedObjectArrays(row, "Registro " + (rowIndex + 1), nestedTables);
          });
          nestedTables.forEach(function (nestedTable) {
            renderObjectArrayTable(articleList, nestedTable.fieldName, nestedTable.rows);
          });

          card.appendChild(articleList);
        }
        parentElement.appendChild(card);
      }

      function appendSectionCard(parentElement, sectionTitle, renderFields, gridClass) {
        var card = document.createElement("section");
        card.className = "card";
        var heading = document.createElement("h2");
        heading.textContent = sectionTitle;
        card.appendChild(heading);
        var list = document.createElement("dl");
        list.className = gridClass || "field-grid";
        renderFields(list);
        card.appendChild(list);
        parentElement.appendChild(card);
      }

      function renderInvoiceDetails(invoiceRecord, invoiceSnapshot, countryCode) {
        var countryTimeZone = countryCode === "SV"
          ? "America/El_Salvador"
          : "America/Guatemala";
        var invoiceTotal = getCalculatedInvoiceTotal(invoiceRecord);
        var processType = determineProcessType(invoiceRecord, countryTimeZone);
        var activeDayCount = calculateActiveDays(
          invoiceRecord,
          countryTimeZone,
          invoiceSnapshot.meta && invoiceSnapshot.meta.ultimoExito
        );
        var slaStatus = "No aplica";
        var slaStatusClass = "status-neutral";
        if (String(invoiceRecord.estatus || "").toLowerCase() === "abierta" &&
            processType !== "Cíclica") {
          var numericActiveDays = Number(activeDayCount);
          if (activeDayCount !== "—" && numericActiveDays <= 2) {
            slaStatus = "En tiempo";
            slaStatusClass = "status-green";
          } else if (activeDayCount !== "—" && numericActiveDays === 3) {
            slaStatus = "Por vencer";
            slaStatusClass = "status-yellow";
          } else if (activeDayCount !== "—" && numericActiveDays > 3) {
            slaStatus = "Vencido";
            slaStatusClass = "status-red";
          } else {
            slaStatus = "No disponible";
          }
        }

        invoiceDetailsElement.replaceChildren();
        appendSectionCard(invoiceDetailsElement, "Seguimiento", function (fieldList) {
          appendLabeledField(fieldList, "Tipo de proceso", processType);
          appendLabeledField(fieldList, "Días activa", activeDayCount);
          var slaStatusElement = appendLabeledField(fieldList, "Estado SLA", slaStatus);
          slaStatusElement.classList.add("status", slaStatusClass);
        });
        appendSectionCard(invoiceDetailsElement, "Datos de la factura", function (fieldList) {
          appendLabeledField(fieldList, "No. factura", invoiceRecord.numeroFactura);
          appendLabeledField(fieldList, "DocEntry (SAP)", invoiceRecord.docEntry);
          appendLabeledField(fieldList, "País", countryCode);
          appendLabeledField(fieldList, "Estatus", invoiceRecord.estatus);
          appendLabeledField(fieldList, "Código de cliente", invoiceRecord.codigoCliente);
          appendLabeledField(fieldList, "Cliente", invoiceRecord.nombreCliente);
          appendLabeledField(
            fieldList,
            "Fecha de emisión",
            formatDate(invoiceRecord.fechaEmision, countryTimeZone)
          );
          appendLabeledField(
            fieldList,
            "Fecha de vencimiento",
            formatDate(invoiceRecord.fechaDespacho, countryTimeZone)
          );
          appendLabeledField(
            fieldList,
            "Total factura",
            formatInvoiceTotal(invoiceTotal, countryCode)
          );
        });
        appendArticleDetails(invoiceDetailsElement, invoiceRecord);
        appendAdditionalInvoiceInfo(invoiceDetailsElement, invoiceRecord);
        errorMessageElement.hidden = true;
        invoiceDetailsElement.hidden = false;
      }

      async function loadInvoiceDetails() {
        var queryParams = new URLSearchParams(window.location.search);
        var countryCode = queryParams.get("pais");
        var requestedDocEntry = queryParams.get("doc");
        var requestedInvoiceNumber = queryParams.get("factura");

        if (!countryCode || (!requestedDocEntry && !requestedInvoiceNumber)) {
          showMessage("Falta un parámetro requerido. El enlace debe incluir pais y doc o factura.");
          return;
        }
        if (countryCode !== "SV" && countryCode !== "GT") {
          showMessage("El país indicado no es válido. Use SV o GT.");
          return;
        }

        var snapshotResponse;
        var invoiceSnapshot;
        try {
          snapshotResponse = await fetch("data/facturas.json?t=" + Date.now());
          if (snapshotResponse.ok) invoiceSnapshot = await snapshotResponse.json();
        } catch (error) {
          showMessage("No se pudo leer el archivo de facturas. Verifique su conexión e inténtelo de nuevo.");
          return;
        }
        if (!snapshotResponse.ok) {
          showMessage("No se pudieron cargar las facturas (error HTTP " +
            snapshotResponse.status + ").");
          return;
        }
        if (!invoiceSnapshot || !Array.isArray(invoiceSnapshot.facturas)) {
          showMessage("No se pudieron leer los datos: el archivo de facturas tiene un formato inesperado.");
          return;
        }

        var matchingInvoice = invoiceSnapshot.facturas.find(function (candidateInvoice) {
          if (!candidateInvoice || String(candidateInvoice.pais) !== countryCode) return false;
          if (requestedDocEntry) {
            return String(candidateInvoice.docEntry) === String(requestedDocEntry);
          }
          return String(candidateInvoice.numeroFactura) === String(requestedInvoiceNumber);
        });
        if (!matchingInvoice) {
          showMessage("Esta factura ya no aparece en el API. Puede que se haya despachado o cerrado.");
          return;
        }
        renderInvoiceDetails(matchingInvoice, invoiceSnapshot, countryCode);
      }

      loadInvoiceDetails();
    }());
  </script>
</body>
</html>
